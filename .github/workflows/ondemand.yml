# 手機按「＋新增」時，中繼站叫起這台機器：領工作 → 算 → 傳回中繼站。
# 同時有好幾檔要新增時，全部在這一台做；做的時候又有人新增，也繼續做，不會開第二台。
name: 手機新增股票

on:
  workflow_dispatch:

concurrency:
  group: ondemand
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.txt
      - run: pip install -r core/requirements.txt
      - name: 取回資料庫（只讀，不存回去；每天的更新才會把新股票存進資料庫）
        run: |
          mkdir -p core/data
          git fetch --depth=1 origin db && git show origin/db:market.db > core/data/market.db || true
      - name: 領工作、計算
        env:
          TZ: Asia/Taipei
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          # 中繼站和這台機器之間的通關密語：由 GH_DISPATCH_TOKEN 算出來，不用另外設定
          export RUNNER_KEY=$(printf '%s' "$GH_DISPATCH_TOKEN-runner" | sha256sum | cut -c1-40)
          python ondemand.py
