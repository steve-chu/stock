# 每個交易日傍晚：抓最新收盤 → 用電腦版程式算好全部分析 → 發佈成手機網頁
name: 每日更新

on:
  schedule:
    - cron: "40 10 * * 1-5"   # 台灣時間 18:40（週一～五）
    - cron: "10 13 * * 1-5"   # 台灣時間 21:10，補抓晚到的資料
  workflow_dispatch:           # 也可以在 Actions 頁面手動按「Run workflow」
  push:
    branches: [main]
    paths: ["stocks.txt", "core/**", "web/**", "build.py"]

permissions:
  contents: write   # 把資料庫存回 db 分支
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.txt

      - run: pip install -r core/requirements.txt

      - name: 取回上次的資料庫（沒有就用 seed）
        run: |
          mkdir -p core/data
          if git fetch --depth=1 origin db 2>/dev/null; then
            git show origin/db:market.db > core/data/market.db && echo "用 db 分支的資料庫"
          else
            echo "第一次執行：用 seed/market.db"
          fi

      - name: 計算
        env:
          TZ: Asia/Taipei
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python build.py

      - name: 資料庫存回 db 分支（只保留最新一份，不會越存越大）
        run: |
          mkdir /tmp/dbb && cp core/data/market.db /tmp/dbb/ && cd /tmp/dbb
          git init -q -b db
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add market.db && git commit -qm "db $(TZ=Asia/Taipei date '+%F %R')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" db

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
