# 自動測試：每次改程式都把全部功能測一遍。
# - 推到 main：由「每日更新」和「部署中繼站」先呼叫這裡，測試全過才會發佈
# - 推到其他分支、開 PR、手動執行：單獨跑這裡
name: 自動測試

on:
  push:
    branches-ignore: [main, db]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  python:
    name: 分析與建置（電腦版 API、每日建置、手機新增、持股計算）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            tests/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -r core/requirements.txt -r tests/requirements.txt
      - run: python -m pytest tests --ignore=tests/e2e -q -ra

  relay:
    name: 中繼站（Cloudflare Worker）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test worker/test/*.test.mjs

  e2e:
    name: 手機畫面（iPhone 尺寸，Chromium＋WebKit/Safari）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            tests/requirements.txt
      - run: pip install -r core/requirements.txt -r tests/requirements.txt
      - name: 安裝瀏覽器
        run: python -m playwright install --with-deps chromium webkit
      - run: python -m pytest tests/e2e -q -ra
